[package]
name    = "proof-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "proof-server"
path = "src/main.rs"

[dependencies]
proof-dsl        = { path = "../proof-dsl" }
proof-eval       = { path = "../proof-eval" }
proof-verify     = { path = "../proof-verify" }
proof-ingest     = { path = "../proof-ingest" }
proof-sim        = { path = "../proof-sim" }
proof-audit = { path = "../proof-audit" }
proof-regulatory = { path = "../proof-regulatory" }
axum               = "0.7"
tower-http         = { version = "0.5", features = ["cors"] }
tokio              = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
anyhow             = { workspace = true }
uuid               = { workspace = true }
chrono             = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
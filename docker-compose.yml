version: "3.9"

services:
  proof-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=sqlite:///data/proof.db
      - RUST_LOG=info
    volumes:
      - proof-data:/data
      - ./regulatory:/regulatory:ro
      - ./examples:/examples:ro

  proof-dashboard:
    build:
      context: ./dashboard
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://proof-server:3001
    depends_on:
      - proof-server

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
    depends_on:
      - zookeeper

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

volumes:
  proof-data:
